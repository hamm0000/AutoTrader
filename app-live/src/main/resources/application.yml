spring:
  application:
    name: autotrader-live

autotrader:
  kis:
    paper:
      base-url: https://openapivts.koreainvestment.com:29443
      app-key: ${KIS_PAPER_APP_KEY:}
      app-secret: ${KIS_PAPER_APP_SECRET:}
      request-timeout: 5s
      minimum-request-interval: ${KIS_PAPER_MINIMUM_REQUEST_INTERVAL:1100ms}
      access-token-cache:
        enabled: ${KIS_PAPER_ACCESS_TOKEN_CACHE_ENABLED:false}
        path: ${KIS_PAPER_ACCESS_TOKEN_CACHE_PATH:${user.home}/.autotrader/kis/paper-access-token.json}
  strategy:
    zscore:
      base-url: ${ZSCORE_SERVER_BASE_URL:}
      request-timeout: ${ZSCORE_SERVER_REQUEST_TIMEOUT:}
  market-calendar:
    refresh:
      coverage-days: ${MARKET_CALENDAR_COVERAGE_DAYS:20}

---
spring:
  config:
    activate:
      on-profile: "!market-calendar-refresh & !paper-trading"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
